publish_to: 'none'
version: 0.1.0+2

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  drift: ^2.28.0
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.0
  workmanager: ^0.9.1
  connectivity_plus: ^6.1.0
  uuid: ^4.5.1
  flutter_riverpod: ^3.5.0
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  package_info_plus: ^10.2.2
  shared_preferences: ^2.5.6
dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.28.0
  build_runner: ^2.4.13
  flutter_lints: ^5.0.0
  integration_test:
    sdk: flutter
  sqlite3: ^3.9.2

flutter:
  uses-material-design: true
