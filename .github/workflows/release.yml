name: release

# Setelah merge ke main: build APK signed, verifikasi tanda tangan, lalu
# tag annotated vX.Y.Z+build + GitHub Release.
#
# Aturan tag:
#   - Tag memuat versionName DAN versionCode: `v0.1.0+2` (app membaca versionCode dari tag).
#   - Tag hanya dibuat bila versi di pubspec.yaml benar-benar bertambah dibanding tag terakhir.
#   - Tag hanya dibuat setelah build + verifikasi tanda tangan berhasil.
#   - Kenaikan build saja (0.1.0+1 -> 0.1.0+2) tetap menghasilkan rilis baru.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: rilis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Baca versi & cek tag terakhir
        id: ver
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -1 | tr -d ' ')
          case "$VERSION" in *+*) ;; *) echo "::error::pubspec.yaml harus berformat x.y.z+build"; exit 1;; esac
          NAME=${VERSION%%+*}
          BUILD=${VERSION##*+}
          TAG="v$NAME+$BUILD"
          echo "pubspec version: $VERSION -> tag $TAG"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          git fetch --tags --force -q
          git tag --list 'v*' --sort=-v:refname | head -5
          DECISION=$(CUR_NAME="$NAME" CUR_BUILD="$BUILD" TAG="$TAG" python3 - <<'PYEOF'
          import os, re, subprocess
          def parse(tag):
              t = tag.strip().lstrip("vV")
              m = re.match(r"^(\d+(?:\.\d+)*)(?:\+(\d+))?$", t)
              if not m:
                  return None
              name = tuple(int(x) for x in m.group(1).split("."))
              build = int(m.group(2)) if m.group(2) else 1  # tag lama tanpa +build = build 1
              return name, build
          cur_name = tuple(int(x) for x in os.environ["CUR_NAME"].split("."))
          cur = (cur_name, int(os.environ["CUR_BUILD"]))
          tags = subprocess.run(["git", "tag", "--list", "v*"], capture_output=True, text=True).stdout.split()
          parsed = [(t, parse(t)) for t in tags]
          parsed = [(t, v) for t, v in parsed if v]
          if os.environ["TAG"] in tags:
              print(f"skip=true\nsebab={os.environ['TAG']} sudah ada (rilis dobel ditolak)")
          elif parsed:
              best_tag, best = max(parsed, key=lambda p: p[1])
              if cur <= best:
                  print(f"skip=true\nsebab=versi {cur[0]}+{cur[1]} tidak lebih tinggi dari {best[0]}+{best[1]} ({best_tag})")
              else:
                  print(f"skip=false\nsebab=naik dari {best[0]}+{best[1]} ({best_tag}) ke {cur[0]}+{cur[1]}")
          else:
              print("skip=false\nsebab=belum ada tag lama")
          PYEOF
          )
          echo "$DECISION"
          echo "$DECISION" | sed -n 's/^skip=//p' | xargs -I{} echo "skip={}" >> "$GITHUB_OUTPUT"
          echo "$DECISION" | sed -n 's/^sebab=//p' >> "$GITHUB_STEP_SUMMARY"

      - name: Java 21
        if: steps.ver.outputs.skip != 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Flutter 3.50.1
        if: steps.ver.outputs.skip != 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.1"
          channel: stable
          cache: true

      - name: Siapkan keystore rilis
        if: steps.ver.outputs.skip != 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ] || [ -z "${KEYSTORE_PASSWORD:-}" ] || [ -z "${KEY_ALIAS:-}" ]; then
            echo "::error::Secret keystore belum lengkap (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD). Build rilis tidak dijalankan dan tidak ada tag/Release."
            exit 1
          fi
          KC="$RUNNER_TEMP/nyatet-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$KC"
          chmod 600 "$KC"
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=$KC"
          } > android/key.properties
          chmod 600 android/key.properties
          git check-ignore -q android/key.properties && echo "key.properties diabaikan git: ok"

      - name: Dependensi
        if: steps.ver.outputs.skip != 'true'
        run: flutter pub get

      # Sejak REL-04 ada dua flavor. APK sideload yang bisa memperbarui diri
      # lewat GitHub; APK play untuk distribusi Play (tanpa cek update sendiri).
      - name: Build APK rilis (signed)
        if: steps.ver.outputs.skip != 'true'
        run: |
          set -euo pipefail
          GRADLE=""
          for f in android/app/build.gradle.kts android/app/build.gradle; do
            [ -f "$f" ] && GRADLE="$f" && break
          done
          if [ -n "$GRADLE" ] && grep -q "productFlavors" "$GRADLE"; then
            echo "flavor terdeteksi — membangun sideload + play"
            flutter build apk --release --flavor sideload -t lib/main_sideload.dart
            flutter build apk --release --flavor play -t lib/main_play.dart
          else
            echo "tanpa flavor — membangun satu APK rilis"
            flutter build apk --release
          fi

      - name: Build AAB rilis (signed)
        if: steps.ver.outputs.skip != 'true'
        run: |
          set -euo pipefail
          GRADLE=""
          for f in android/app/build.gradle.kts android/app/build.gradle; do
            [ -f "$f" ] && GRADLE="$f" && break
          done
          if [ -n "$GRADLE" ] && grep -q "productFlavors" "$GRADLE"; then
            flutter build appbundle --release --flavor play -t lib/main_play.dart
          else
            flutter build appbundle --release
          fi

      - name: Beri nama artefak & hitung SHA-256
        if: steps.ver.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          OUT=build/app/outputs/flutter-apk
          if [ -f "$OUT/app-sideload-release.apk" ]; then
            cp "$OUT/app-sideload-release.apk" "dist/nyatet-v$VERSION-sideload.apk"
            cp "$OUT/app-play-release.apk" "dist/nyatet-v$VERSION-play.apk"
          else
            cp "$OUT/app-release.apk" "dist/nyatet-v$VERSION.apk"
          fi
          AAB=build/app/outputs/bundle/playRelease/app-play-release.aab
          [ -f "$AAB" ] || AAB=build/app/outputs/bundle/release/app-release.aab
          if [ ! -f "$AAB" ]; then echo "::error::AAB rilis tidak dihasilkan"; exit 1; fi
          cp "$AAB" "dist/nyatet-v$VERSION-play.aab"
          ( cd dist && shasum -a 256 ./*.apk ./*.aab | sed 's|  \./|  |' | tee ../sha256.txt )
          ls -l dist

      - name: Verifikasi tanda tangan rilis
        if: steps.ver.outputs.skip != 'true'
        run: |
          set -euo pipefail
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          if [ -z "$APKSIGNER" ]; then echo "::error::apksigner tidak ditemukan"; exit 1; fi
          : > certs.txt
          for apk in dist/*.apk; do
            "$APKSIGNER" verify --print-certs "$apk" | tee -a certs.txt
            if grep -qi "CN=Android Debug" certs.txt; then
              echo "::error::$apk ditandatangani kunci debug — rilis dibatalkan."
              exit 1
            fi
          done
          AAB=$(ls dist/*.aab 2>/dev/null | head -1 || true)
          if [ -n "$AAB" ]; then
            if ! jarsigner -verify "$AAB" 2>&1 | grep -q "jar verified"; then
              echo "::error::$AAB tidak terverifikasi (jarsigner)"
              exit 1
            fi
            AAB_DIGEST=$(keytool -printcert -jarfile "$AAB" | sed -n 's/^[[:space:]]*SHA256: //p' | head -1 | tr -d ':' | tr 'A-F' 'a-f')
            echo "AAB certificate SHA-256 digest: $AAB_DIGEST" | tee -a certs.txt
          fi
          DIGESTS=$(grep -i "certificate SHA-256 digest" certs.txt | awk '{print $NF}' | sort -u)
          if [ "$(printf '%s\n' "$DIGESTS" | wc -l | tr -d ' ')" != "1" ]; then
            echo "::error::APK rilis memakai sertifikat berbeda-beda — rilis dibatalkan."
            exit 1
          fi
          {
            echo "### Tanda tangan"
            echo '```'
            echo "$DIGESTS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Susun catatan rilis
        if: steps.ver.outputs.skip != 'true'
        env:
          NAME: ${{ steps.ver.outputs.name }}
          VERSION: ${{ steps.ver.outputs.version }}
          BUILD: ${{ steps.ver.outputs.build }}
        run: |
          set -euo pipefail
          SPEC="v$VERSION"
          CHANGELOG=$(awk '/^## /{c++} c==1' CHANGELOG.md)
          if [ -z "$CHANGELOG" ]; then CHANGELOG=$(printf 'Tidak ada catatan di CHANGELOG.md.'); fi
          DIGEST=$(grep -i "certificate SHA-256 digest" certs.txt | awk '{print $NF}' | sort -u | head -1)
          {
            echo "## Nyatet $NAME (build $BUILD)"
            echo
            echo "$CHANGELOG"
            echo
            echo "---"
            echo
            echo "**Pasang:** unduh APK sideload, buka, izinkan pemasangan dari sumber ini bila diminta."
            echo "Versi lama akan diperbarui tanpa uninstall (kunci tanda tangan sama)."
            echo
            echo "| Berkas | Ukuran | SHA-256 |"
            echo "|---|---|---|"
            while read -r hash file; do
              size=$(wc -c < "dist/$(basename "$file")" | tr -d ' ')
              echo "| \`$(basename "$file")\` | $size byte | \`$hash\` |"
            done < sha256.txt
            echo
            echo "- versionName: \`$NAME\`"
            echo "- versionCode: \`$BUILD\`"
            echo "- Tag: \`$SPEC\`"
            echo "- Sertifikat: \`$DIGEST\`"
            echo
            echo "Sidik sertifikat ini sama di setiap rilis, sehingga pembaruan bisa dipasang di atas versi lama."
          } > notes.md
          cat notes.md

      - name: Unggah AAB sebagai artefak run
        if: steps.ver.outputs.skip != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: nyatet-aab-${{ steps.ver.outputs.version }}
          path: dist/*.aab
          if-no-files-found: error
          retention-days: 30

      - name: Buat tag annotated + GitHub Release
        if: steps.ver.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
          BUILD: ${{ steps.ver.outputs.build }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Nyatet $TAG (versionCode $BUILD)"
          git push origin "$TAG"
          gh release create "$TAG" dist/*.apk \
            --title "Nyatet ${TAG#v}" \
            --notes-file notes.md \
            --verify-tag
